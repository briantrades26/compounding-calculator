<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scenarios">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Compounding Scenarios</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--txt:#111;--sub:#6b6b70;--pos:#1f9d55}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--txt:#f2f2f7;--sub:#9a9aa0}}
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 10px 40px}
h1{font-size:24px;margin:16px 4px 8px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block;font-size:17px;padding:11px;border-radius:10px;border:1px solid #8884;background:transparent;color:var(--txt)}
.big{font-size:28px;font-weight:700}.sub{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
th,td{text-align:right;padding:6px 2px;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #8883;white-space:nowrap}
th{font-size:11px;color:var(--sub);position:sticky;top:0;background:var(--card)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}.wd{width:100%;font-size:12px;padding:4px 2px;text-align:right;border-radius:6px;color:#d9534f}.wd.man{background:#ffcc0033;font-weight:600}.pos{color:var(--pos)}
.wrap{overflow-x:auto}
input[type=date]{text-align:left;min-height:46px}input[type=date]::-webkit-date-and-time-value{text-align:left}</style></head><body>
<h1>Compounding Scenarios</h1>
<div class="card">
<label>Principal ($)</label><input id="p" type="text" inputmode="decimal" autocomplete="off" value="10,000">
<label>Daily Profit Rate (%)</label><input id="r" type="number" inputmode="decimal" value="2">
<label>Length of Term (trading days, weekends excluded)</label><input id="n" type="number" inputmode="numeric" value="20">
<label>Compounding Start Date</label><input id="d" type="date">
</div>
<div class="card">
<div class="sub" style="font-weight:600;color:var(--txt)">Withdrawal Schedule (optional)</div>
<label>Prepared For</label><input id="pf" type="text" autocomplete="off" placeholder="Name">
<label>Every how many trading days</label><input id="wf" type="number" inputmode="numeric" placeholder="e.g. 5">
<label>Pay out for how many trading days from First Payout Date (blank = until end of term)</label><input id="wl" type="number" inputmode="numeric" placeholder="e.g. 60">
<label>Amount ($)</label><input id="wa" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 2,500">
<label>First Payout Date (can be later, to let it compound first)</label><input id="ws" type="date">
<div class="sub" style="margin-top:8px">Scheduled withdrawals show in the Withdraw column automatically. Tap the box in any row to type an extra withdrawal; it adds on top of the schedule.</div>
<button id="clr" style="margin-top:10px;font-size:15px;padding:9px 12px;border-radius:10px;border:1px solid #8884;background:transparent;color:var(--txt)">Clear extra withdrawals</button>
</div>
<div class="card">
<div class="sub">Ending Balance</div><div class="big" id="end">$0</div>
<div class="sub" id="summary"></div><div class="sub" id="wsum"></div>
<button id="share" style="width:100%;margin-top:12px;font-size:17px;font-weight:600;padding:12px;border-radius:12px;border:0;background:#1f9d55;color:#fff">Share Withdrawals</button></div>
<div class="card wrap"><table>
<thead><tr><th style="width:8%">Day</th><th style="width:13%">Date</th><th style="width:21%">Beg Bal</th><th style="width:17%">Profit</th><th style="width:20%">Withdraw</th><th style="width:21%">End Bal</th></tr></thead>
<tbody id="tbl"></tbody></table></div>
<script>
const $=id=>document.getElementById(id);
const money=v=>'$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const m0=v=>'$'+Math.round(v).toLocaleString();
let PAY=[],SDAYS=0,LASTD=null,FIRSTD=null,G={};const ids=['p','r','n','d','wf','wa','ws','pf','wl'];let man=JSON.parse(localStorage.getItem('cs1_extra')||'{}');const num=v=>+String(v).replace(/[^\d.]/g,'')||0;const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date();$('d').value=iso(today);
ids.forEach(i=>{const s=localStorage.getItem('cs1_'+i);if(s)$(i).value=s;if(i!=='p'&&i!=='wa'){$(i).addEventListener('input',calc);$(i).addEventListener('change',calc)}});
function fmtP(el){el=el&&el.nodeType?el:$('p');const v=el.value,pos=el.selectionStart??v.length;
 const digitsBefore=v.slice(0,pos).replace(/[^\d.]/g,'').length;
 let raw=v.replace(/[^\d.]/g,'');const k=raw.indexOf('.');if(k>=0)raw=raw.slice(0,k+1)+raw.slice(k+1).replace(/\./g,'').slice(0,2);
 const [a,b]=raw.split('.');const out=(a?a.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,','):(b!==undefined?'0':''))+(b!==undefined?'.'+b:'');
 el.value=out;let c=0,i=0;while(i<out.length&&c<digitsBefore){if(/[\d.]/.test(out[i]))c++;i++}
 if(document.activeElement===el&&el.value!==v){const j=i;requestAnimationFrame(()=>{try{el.setSelectionRange(j,j)}catch(_){}})}}
['p','wa'].forEach(id=>{['input','keyup','change'].forEach(ev=>$(id).addEventListener(ev,()=>{fmtP($(id));calc()}));fmtP($(id))});
$('clr').onclick=()=>{man={};localStorage.setItem('cs1_extra','{}');calc()};
$('tbl').addEventListener('change',e=>{const t=e.target;if(!t.classList.contains('wd'))return;const k=t.dataset.k;if(num(t.value)<=0)delete man[k];else man[k]=num(t.value);localStorage.setItem('cs1_extra',JSON.stringify(man));calc()});

const _hc={};function isHol(dt){const y=dt.getFullYear();if(!_hc[y]){const H=new Set(),f=d=>H.add(iso(d));
 const obs=(m,d)=>{const t=new Date(y,m,d);if(t.getDay()==6)t.setDate(t.getDate()-1);else if(t.getDay()==0)t.setDate(t.getDate()+1);return t};
 const nth=(m,wd,n)=>{const t=new Date(y,m,1);while(t.getDay()!=wd)t.setDate(t.getDate()+1);t.setDate(t.getDate()+7*(n-1));return t};
 const last=(m,wd)=>{const t=new Date(y,m+1,0);while(t.getDay()!=wd)t.setDate(t.getDate()-1);return t};
 const ny=new Date(y,0,1);if(ny.getDay()!=6)f(obs(0,1));
 f(nth(0,1,3));f(nth(1,1,3));
 const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,g=Math.floor((8*b+13)/25),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+19*l)/433),mo=Math.floor((h+l-7*m+90)/25),da=(h+l-7*m+33*mo+19)%32;
 f(new Date(y,mo-1,da-2));f(last(4,1));f(obs(5,19));f(obs(6,4));f(nth(8,1,1));f(nth(10,4,4));f(obs(11,25));_hc[y]=H}
 return _hc[y].has(iso(dt))}
function isBankHol(dt){const y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate(),wd=dt.getDay();
 const nthMon=(mm,n)=>{const t=new Date(y,mm,1);while(t.getDay()!=1)t.setDate(t.getDate()+1);return t.getDate()+7*(n-1)};
 if(m==9&&d==nthMon(9,2))return true;
 if(m==10&&(d==11||(wd==1&&d==12)))return true;
 return false}
function calc(){
 ids.forEach(i=>localStorage.setItem('cs1_'+i,$(i).value));
 const P=+$('p').value.replace(/,/g,'')||0,r=(+$('r').value||0)/100,n=Math.min(Math.max(parseInt($('n').value)||0,0),3000);
 const [y,m,dd]=($('d').value||iso(today)).split('-').map(Number);
 const wl=parseInt($('wl').value)||0,wf=parseInt($('wf').value)||0,wa=num($('wa').value),ws=$('ws').value||$('d').value||iso(today);
 PAY=[];SDAYS=0;LASTD=null;FIRSTD=null;let dt=new Date(y,m-1,dd),b=P,rows='',tw=0,tsw=0,tp=0,cnt=-1,carry=0;
 for(let k=1;k<=n;k++){
  while(dt.getDay()==0||dt.getDay()==6||isHol(dt)){if(isHol(dt)&&dt.getDay()%6)rows+=`<tr style="opacity:.45"><td></td><td>${dt.toLocaleDateString(undefined,{month:'numeric',day:'numeric'})}</td><td colspan="2" style="text-align:left">Market holiday</td><td><input class="wd" disabled placeholder="—"></td><td>${m0(b)}</td></tr>`;dt.setDate(dt.getDate()+1);}
  const key=iso(dt),beg=b,pr=beg*r;tp+=pr;
  let w=carry,moved=carry>0;carry=0;const inS=wf>0&&wa>0&&key>=ws&&(!wl||cnt+1<wl);if(inS){cnt++;if(cnt%wf===0)w+=wa}
  const bh=isBankHol(dt);if(bh&&w>0){carry=w;w=0}
  const ex=man[key]||0;w=Math.min(w,beg+pr);tsw+=w;const e2=Math.min(ex,beg+pr-w);tw+=w+e2;b=beg+pr-w-e2;if(inS)SDAYS++;if(w+e2>0)PAY.push([key,w+e2]);
  rows+=`<tr><td>${k}</td><td>${dt.toLocaleDateString(undefined,{month:'numeric',day:'numeric'})}</td><td>${m0(beg)}</td><td class="pos">${m0(pr)}</td><td>${bh?'<div style="font-size:10px;opacity:.6">Bank holiday</div>':''}${w?`<div style="color:#d9534f">${m0(w)}${moved?' (moved)':''}</div>`:''}<input class="wd${ex?' man':''}" ${bh?'disabled':''} data-k="${key}" inputmode="decimal" value="${ex?Math.round(ex).toLocaleString():''}" placeholder="${w?'+ extra':'+'}"></td><td>${m0(b)}</td></tr>`;
  if(!FIRSTD)FIRSTD=new Date(dt);LASTD=new Date(dt);dt.setDate(dt.getDate()+1);
 }
 G={P,n,tw,tsw,b,tp};$('end').textContent=money(b);
 $('summary').innerHTML=`Total profit ${money(tp)} over ${n} trading days<br>(${(n/5).toFixed(1)} weeks, ${(n/21).toFixed(1)} months)`;
 $('wsum').innerHTML=`Total withdrawn ${money(tw)} (scheduled ${money(tsw)}, extra ${money(tw-tsw)})<br>Withdrawn + ending balance ${money(tw+b)}`;
 $('tbl').innerHTML=rows;
}
function applyURL(){const q=new URLSearchParams(location.search);let any=false;ids.forEach(i=>{if(q.has(i)){$(i).value=q.get(i);any=true}});if(any||q.has('x')){man={};if(q.has('x')){try{man=JSON.parse(q.get('x'))}catch(_){}}localStorage.setItem('cs1_extra',JSON.stringify(man));any=true}if(any)history.replaceState(null,'',location.pathname);return any}
$('share').onclick=async()=>{const q=new URLSearchParams();['pf','p','wf','wa','ws','wl'].forEach(i=>{if($(i).value)q.set(i,$(i).value)});if(Object.keys(man).length)q.set('x',JSON.stringify(man));
 const url=location.origin+location.pathname+'?'+q.toString();
 const fd=s=>{if(!s)return'';const[y,m,d]=s.split('-');return +m+'/'+ +d+'/'+y};
 const ex=Object.keys(man).sort().map(k=>fd(k)+' $'+Math.round(man[k]).toLocaleString()).join(', ');
 calc();const PRN=G.P,TW=G.tw,BAL=TW;const fdt=d=>(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
 let text=($('pf').value.trim()?'Prepared For:\n'+$('pf').value.trim()+'\n\n':'')+'Principal investment: '+money(PRN)+'\n\n';
 if(+$('wf').value>0&&num($('wa').value)>0)text+='Payout schedule:\n'+money(num($('wa').value))+'\nFrequency:\nEvery '+$('wf').value+' trading days'+(+$('wl').value>0?'\nPeriod:\n'+$('wl').value+' trading days':'')+'\n\n';
 text+=PAY.length?'Starting date: '+fd(PAY[0][0])+'\nEnding Date: '+fd(PAY[PAY.length-1][0])+'\n\n':'';
 text+='Please expect payment within 3 to 5 business days of each withdrawal date.\n\n';
 text+='Balance to be Paid:\n'+money(BAL)+'\n\nProfit:\n'+money(BAL-PRN)+(PRN>0?'\n('+((BAL-PRN)/PRN*100).toFixed(1)+'%)':'');
 if(PRN>0&&PAY.length){const toD=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};const days=Math.round((toD(PAY[PAY.length-1][0])-FIRSTD)/864e5)+1;const ann=(BAL-PRN)/PRN*365/days*100;text+='\n\nEquivalent to about '+Math.round(ann).toLocaleString()+'% per year (simple, not compounded)';}
 text+='\n\nDisclosures: This is a hypothetical projection for illustration only and is not an offer, guarantee, or promise of any return or payment. Trading futures involves substantial risk of loss, including loss of principal, and past or modeled performance does not guarantee future results. Actual results, withdrawal amounts, and timing may differ materially. This is not investment, tax, or legal advice.';
 try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text);alert('Copied to clipboard')}catch(_){prompt('Copy this link',url)}};
applyURL();['p','wa'].forEach(id=>fmtP($(id)));
calc();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script><div style="text-align:center;opacity:.4;font-size:11px;margin:12px">v5</div></body></html>
